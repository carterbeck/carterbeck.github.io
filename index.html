<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcGIS StoryMap Embed</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        .storymaps-root {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div class="storymaps-root"></div>

    <script>
        window.storyMapsEmbedConfig = {
        "storyId": "0f41770f498a462481765d6305e94cd1",
        "rootNode": ".storymaps-root"
    }
    </script>
    <script src="https://storymaps.arcgis.com/embed/view"></script>
</body>
</html>
